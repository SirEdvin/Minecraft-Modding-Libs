name: Deploy OpenWiki

on:
  push:
    branches: [multiversion]
    paths:
      - openwiki/**
      - mkdocs.yml
      - scripts/openwiki-pages.py
      - .github/workflows/openwiki-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openwiki-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}openwiki/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build OpenWiki under its subfolder
        run: |
          python -m pip install mkdocs==1.6.1
          python -m mkdocs build --strict --site-dir "$RUNNER_TEMP/pages/openwiki"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/pages/openwiki/source-commit.txt"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
