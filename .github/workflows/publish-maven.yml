name: Publish Maven artifacts

on:
  push:
    tags:
      - "broccolium-*"
      - "peripheralium-*"
      - "testiarium-*"
      - "tweakium-*"
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: choice
        options: [broccolium, peripheralium, testiarium, tweakium]
      minecraft:
        required: true
        type: choice
        options: ["1.20", "1.21", "26.1.2"]
      target:
        required: true
        type: choice
        options: [common, fabric, forge]

permissions:
  contents: read

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_MINECRAFT: ${{ inputs.minecraft }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          target=all
          tag_version=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            project="$INPUT_PROJECT"
            tag_minecraft="$INPUT_MINECRAFT"
            target="$INPUT_TARGET"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^(broccolium|peripheralium|testiarium|tweakium)-(1\.20|1\.21|26\.1\.2)-(.+)$ ]]; then
              echo "::error::Tag must match <project>-<1.20|1.21|26.1.2>-<version>"
              exit 1
            fi
            project="${BASH_REMATCH[1]}"
            tag_minecraft="${BASH_REMATCH[2]}"
            tag_version="${BASH_REMATCH[3]}"
          fi
          case "$tag_minecraft" in
            1.20) node=1.20.1 ;;
            1.21) node=1.21.1 ;;
            26.1.2) node=26.1.2 ;;
            *) exit 1 ;;
          esac
          version_property="${project}Version"
          project_version=""
          while IFS='=' read -r key value; do
            key="${key//[[:space:]]/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$key" == "$version_property" ]]; then project_version="$value"; fi
          done < gradle.properties
          if [[ -z "$project_version" || ( "$GITHUB_EVENT_NAME" == "push" && "$tag_version" != "$project_version" ) ]]; then
            echo "::error::Tag library version $tag_version does not match configured $version_property"
            exit 1
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Java 25 launcher and toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check and stage the selected publications
        env:
          PROJECT: ${{ steps.release.outputs.project }}
          NODE: ${{ steps.release.outputs.node }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/verification
          tasks=()
          for target in common fabric forge; do
            if [[ "$TARGET" != all && "$TARGET" != "$target" ]]; then continue; fi
            path=":$PROJECT:$NODE"
            if [[ "$target" != common ]]; then path=":$PROJECT:$target:$NODE"; fi
            tasks+=("$path:check" "$path:publishAllPublicationsToReleaseStageRepository")
          done
          timeout --foreground 2700s ./gradlew --no-daemon --console=plain \
            -I scripts/maven-release.init.gradle "${tasks[@]}" > build/verification/stage.log 2>&1
          python3 scripts/test-verification.py
          python3 scripts/maven-release.py --project "$PROJECT" --minecraft "$NODE" --target "$TARGET" \
            --output build/verification/preflight.json > build/verification/publish-tasks.txt

      - name: Publish verified absent coordinates
        id: upload
        env:
          ORG_GRADLE_PROJECT_SirEdvinUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_SirEdvinPassword: ${{ secrets.MAVEN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ORG_GRADLE_PROJECT_SirEdvinUsername" || -z "$ORG_GRADLE_PROJECT_SirEdvinPassword" ]]; then
            echo "::error::MAVEN_USERNAME and MAVEN_PASSWORD secrets are required"
            exit 1
          fi
          mapfile -t tasks < build/verification/publish-tasks.txt
          if [[ ${#tasks[@]} -gt 0 ]]; then
            timeout --foreground 900s ./gradlew --no-daemon --console=plain "${tasks[@]}" > build/verification/publish.log 2>&1
          fi

      - name: Read back every published artifact
        if: ${{ always() && steps.upload.outcome != 'skipped' }}
        env:
          PROJECT: ${{ steps.release.outputs.project }}
          NODE: ${{ steps.release.outputs.node }}
          TARGET: ${{ steps.release.outputs.target }}
        run: |
          python3 scripts/maven-release.py --project "$PROJECT" --minecraft "$NODE" --target "$TARGET" \
            --verify --output build/verification/publication-manifest.json

      - name: Preserve publication ledger and staged bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            build/verification/**
            build/maven-stage/**
