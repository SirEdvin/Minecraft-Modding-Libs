name: Publish Maven artifacts

on:
  push:
    tags:
      - "broccolium-*"
      - "peripheralium-*"
      - "testiarium-*"
      - "tweakium-*"
  workflow_dispatch:
    inputs:
      project:
        required: true
        type: choice
        options: [broccolium, peripheralium, testiarium, tweakium]
      minecraft:
        required: true
        type: choice
        options: ["1.20", "1.21"]
      target:
        required: true
        type: choice
        options: [common, fabric, forge]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          target=all
          tag_version=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            project="${{ inputs.project }}"
            tag_minecraft="${{ inputs.minecraft }}"
            target="${{ inputs.target }}"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^(broccolium|peripheralium|testiarium|tweakium)-(1\.20|1\.21)-(.+)$ ]]; then
              echo "::error::Tag must match <project>-1.20-<version> or <project>-1.21-<version>"
              exit 1
            fi

            project="${BASH_REMATCH[1]}"
            tag_minecraft="${BASH_REMATCH[2]}"
            tag_version="${BASH_REMATCH[3]}"
          fi

          case "$tag_minecraft" in
            1.20)
              node=1.20.1
              ;;
            1.21)
              node=1.21.1
              ;;
          esac
          version_property="${project}Version"

          project_version=""
          while IFS='=' read -r key value; do
            key="${key//[[:space:]]/}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$key" == "$version_property" ]]; then
              project_version="$value"
            fi
          done < gradle.properties

          if [[ -z "$project_version" || ( "$GITHUB_EVENT_NAME" == "push" && "$tag_version" != "$project_version" ) ]]; then
            echo "::error::Tag library version $tag_version does not match configured $version_property"
            exit 1
          fi

          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish ${{ steps.release.outputs.project }} for ${{ steps.release.outputs.node }}
        env:
          ORG_GRADLE_PROJECT_SirEdvinUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_SirEdvinPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [[ -z "$ORG_GRADLE_PROJECT_SirEdvinUsername" || -z "$ORG_GRADLE_PROJECT_SirEdvinPassword" ]]; then
            echo "::error::MAVEN_USERNAME and MAVEN_PASSWORD secrets are required"
            exit 1
          fi

          project="${{ steps.release.outputs.project }}"
          node="${{ steps.release.outputs.node }}"
          target="${{ steps.release.outputs.target }}"
          if [[ "$target" == "all" ]]; then
            ./gradlew --no-daemon \
              ":${project}:${node}:publish" \
              ":${project}:fabric:${node}:publish" \
              ":${project}:forge:${node}:publish"
          elif [[ "$target" == "common" ]]; then
            ./gradlew --no-daemon ":${project}:${node}:publish"
          else
            ./gradlew --no-daemon ":${project}:${target}:${node}:publish"
          fi
