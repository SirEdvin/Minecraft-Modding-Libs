import groovy.json.JsonOutput
import org.gradle.api.publish.maven.MavenPublication

// A private file repository exposes exactly the bytes the real publication tasks upload.
gradle.projectsEvaluated {
    def model = []
    rootProject.allprojects.each { p ->
        def publishing = p.extensions.findByName('publishing')
        if (publishing != null) {
            publishing.publications.withType(MavenPublication).each { pub ->
                model << [project: p.path, publication: pub.name, group: pub.groupId,
                          artifact: pub.artifactId, version: pub.version,
                          repositories: publishing.repositories.collect { [name: it.name, url: it.url.toString()] },
                          artifacts: pub.artifacts.collect { [classifier: it.classifier, extension: it.extension] }]
            }
            publishing.repositories.maven {
                name = 'ReleaseStage'
                url = rootProject.layout.buildDirectory.dir('maven-stage').get().asFile.toURI()
            }
        }
    }
    def output = rootProject.layout.buildDirectory.file('verification/maven-model.json').get().asFile
    output.parentFile.mkdirs()
    output.text = JsonOutput.prettyPrint(JsonOutput.toJson(model))
}
